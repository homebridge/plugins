name: Plugin Checks (Request)
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin Name
        required: true
        type: string
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
permissions:
  contents: read
  issues: write

jobs:
  check-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check if should run
        id: should-run
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PLUGIN_INPUT: ${{ inputs.plugin }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_VERIFICATION_LABEL: ${{ contains(github.event.issue.labels.*.name, 'request-verification') }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [[ "$EVENT_NAME" == "issues" ]] && [[ "$HAS_VERIFICATION_LABEL" == "true" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]] && [[ -n "$PLUGIN_INPUT" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            FIRST_LINE=$(echo "$COMMENT_BODY" | head -n 1 | tr -d ' \t\r')
            if [[ "$FIRST_LINE" == "/check" ]] && [[ "$HAS_VERIFICATION_LABEL" == "true" ]]; then
              echo "run=true" >> $GITHUB_OUTPUT
              echo "comment_id=$COMMENT_ID" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - name: React with eyes emoji
        if: steps.should-run.outputs.run == 'true' && github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: 'eyes'
            });
      - name: Remove awaiting-final-review label
        if: steps.should-run.outputs.run == 'true' && github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'awaiting-final-review'
              });
              console.log('Removed awaiting-final-review label');
            } catch (error) {
              console.log('Label awaiting-final-review not found or already removed');
            }
      - name: Install Dependencies & Build
        if: steps.should-run.outputs.run == 'true'
        run: npm install && npm install --prefix src/plugin-checks/workspace && npm run plugin-checks:build
      - name: Extract Plugin Name
        if: steps.should-run.outputs.run == 'true'
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          PLUGIN_INPUT: ${{ inputs.plugin }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PLUGIN_NAME="$PLUGIN_INPUT"
          else
            PLUGIN_NAME=$(echo "$ISSUE_BODY" | awk 'NR==3' | tr -d ' ')
          fi
          PLUGIN_NAME=$(echo "$PLUGIN_NAME" | tr -d '\n\r')
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
      - name: Check Plugin
        if: steps.should-run.outputs.run == 'true'
        uses: ./src/plugin-checks
        with:
          plugin: ${{ steps.extract.outputs.plugin_name }}
