name: Icon Request Check

# Checks an icon request whenever it is opened, edited or reopened (or when someone
# comments `/check` on it, or a maintainer runs this by hand), and keeps one comment
# on the issue up to date saying whether it is ready to approve. Nothing is committed.
#
# The comment carries a hidden marker with the result and a SHA-256 of the image it
# checked. The Icon Approved workflow (icon-approved.yml) only applies an icon when
# the latest check passed and the image is still the one that was checked.
#
# A request for a plugin that is not verified is reported as needing changes, but the
# marker still records the request and image as valid. Icon Approved does not look at
# verification, so a maintainer can still approve one as a one-off.
on:
  issues:
    types:
      - opened
      - edited
      - reopened
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number of the icon request
        required: true
        type: number

permissions: {}

jobs:
  load:
    # Cheap filters here; the rest is decided once the issue is loaded
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues'
        && (contains(github.event.issue.labels.*.name, 'request-icon') || startsWith(github.event.issue.title, 'Plugin Icon Request:')))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request == null
        && github.event.comment.user.type != 'Bot'
        && contains(github.event.issue.labels.*.name, 'request-icon'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      run: ${{ steps.load.outputs.run }}
      number: ${{ steps.load.outputs.number }}
      body: ${{ steps.load.outputs.body }}
      author: ${{ steps.load.outputs.author }}
      author_is_maintainer: ${{ steps.load.outputs.author_is_maintainer }}
    steps:
      - name: Load the issue
        id: load
        uses: actions/github-script@v9
        env:
          DISPATCH_ISSUE: ${{ inputs.issue }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            // A comment only counts when /check is on a line of its own
            if (context.eventName === 'issue_comment'
              && !context.payload.comment.body.split('\n').some(line => line.trim() === '/check')) {
              core.setOutput('run', 'false');
              return;
            }

            // Always read the issue fresh, so the check sees its current body
            const number = Number(process.env.DISPATCH_ISSUE || context.issue.number);
            const { data: issue } = await github.rest.issues.get({ ...repo, issue_number: number });
            const isIconRequest = issue.labels.some(l => l.name === 'request-icon')
              || issue.title.startsWith('Plugin Icon Request:');
            if (issue.state !== 'open' || issue.pull_request || !isIconRequest) {
              core.info(`#${number} is not an open icon request; nothing to check.`);
              core.setOutput('run', 'false');
              return;
            }

            let permission = 'none';
            try {
              ({ data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username: issue.user.login }));
            } catch {}

            core.setOutput('run', 'true');
            core.setOutput('number', String(number));
            core.setOutput('body', issue.body || '');
            core.setOutput('author', issue.user.login);
            core.setOutput('author_is_maintainer', String(['admin', 'maintain', 'write'].includes(permission)));

  check:
    needs: load
    if: needs.load.outputs.run == 'true'
    # A newer edit makes an older check pointless. Set here rather than on the whole
    # workflow, so an ordinary comment (which loads but skips this job) cancels nothing.
    concurrency:
      group: icon-request-check-${{ needs.load.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.prepare.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: latest
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: v24

      - name: Install sharp
        run: npm install --no-save sharp@0.35.4

      - name: Check the request
        id: prepare
        env:
          ISSUE_BODY: ${{ needs.load.outputs.body }}
          ISSUE_AUTHOR: ${{ needs.load.outputs.author }}
          AUTHOR_IS_MAINTAINER: ${{ needs.load.outputs.author_is_maintainer }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICON_FILE: ${{ runner.temp }}/icon.png
          RESULT_FILE: ${{ runner.temp }}/icon-result.json
        run: |
          node scripts/apply-icon-request.js prepare
          # Note whether the plugin is verified; only this check cares
          PLUGIN=$(jq -r '.plugin // empty' "$RESULT_FILE")
          if [[ -n "$PLUGIN" ]]; then
            jq --arg plugin "$PLUGIN" --slurpfile verified verified-plugins.json --slurpfile plus verified-plus-plugins.json \
              '. + {verified: (($verified[0] + $plus[0]) | index($plugin) != null)}' "$RESULT_FILE" > "$RESULT_FILE.tmp"
            mv "$RESULT_FILE.tmp" "$RESULT_FILE"
          fi
          echo "result=$(jq -c . "$RESULT_FILE")" >> "$GITHUB_OUTPUT"

  report:
    needs:
      - load
      - check
    if: always() && needs.load.outputs.run == 'true' && needs.check.result != 'cancelled'
    concurrency:
      group: icon-request-check-report-${{ needs.load.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Update the check comment and labels
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.load.outputs.number }}
          RESULT: ${{ needs.check.outputs.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = 'icon-request-check';
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.ISSUE_NUMBER) };
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const run = `${repoUrl}/actions/runs/${context.runId}`;

            let result;
            try {
              result = JSON.parse(process.env.RESULT);
            } catch {
              result = { ok: false, error: 'The check failed before it produced a result; a maintainer will look at the workflow log.' };
            }

            // Ready for review only if the request is valid and the plugin is verified
            const notVerified = result.ok && result.verified === false;
            const ready = result.ok && !notVerified;

            // Hidden data the Icon Approved workflow reads when the icon is approved. `ok`
            // means the request and image are valid, even for a plugin that is not
            // verified, so a maintainer can still approve that as a one-off.
            const data = { ok: result.ok === true, verified: result.verified ?? null, sha256: result.sourceSha256 || null, plugin: result.plugin || null };
            let body = `<!-- ${MARKER} ${JSON.stringify(data)} -->\n`;
            if (result.ok) {
              const size = result.width === 100 && result.height === 100
                ? '100 × 100 px'
                : `${result.width} × ${result.height} px, will be resized to 100 × 100 px`;
              body += (ready
                ? '### ✅ This icon request is ready for review\n\n'
                : '### ❌ This icon request needs changes\n\n'
                  + `> \`${result.plugin}\` is not a verified plugin. Icons are added for verified plugins, so please [request verification](${repoUrl}/issues/new/choose) first.\n\n`)
                + `- **Plugin:** \`${result.plugin}\`\n`
                + `- **Requested by:** ${result.requester}\n`
                + `- **Icon:** ${size}\n`
                + (result.replaces
                  ? `- **Replaces the current icon:** <img src="${repoUrl}/raw/latest/${result.replaces}" width="50" height="50" alt="current icon">\n`
                  : '')
                + `\n<img src="${result.source}" width="100" height="100" alt="requested icon">\n\n`
                + (ready
                  ? 'A maintainer will review the icon. If you change it, this check runs again.'
                  : 'Once the plugin is verified, comment `/check` to run this check again.');
            } else {
              body += '### ❌ This icon request needs changes\n\n'
                + `> ${result.error}\n\n`
                + 'Please edit the issue to fix this; the check runs again when you do. You can also comment `/check` to re-run it.';
            }
            body += `\n\n<sub>Checked ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC · [workflow run](${run})</sub>`;

            // Keep one check comment per issue, updated in place
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(`<!-- ${MARKER} `));
            if (existing) {
              await github.rest.issues.updateComment({ ...issue, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

            const { data: current } = await github.rest.issues.get(issue);
            const has = name => current.labels.some(l => l.name === name);
            const add = [];
            if (!has('request-icon')) {
              add.push('request-icon');
            }
            add.push(ready ? 'awaiting-final-review' : 'awaiting-changes');
            const remove = ['pending', ready ? 'awaiting-changes' : 'awaiting-final-review'];
            await github.rest.issues.addLabels({ ...issue, labels: add });
            for (const name of remove.filter(has)) {
              await github.rest.issues.removeLabel({ ...issue, name });
            }

            const summary = core.summary.addHeading(`Icon request check: #${issue.issue_number}`, 3);
            if (result.ok) {
              summary
                .addRaw(ready
                  ? '✅ **Ready for review**'
                  : '❌ **Needs changes:** the plugin is not verified. The request and image are otherwise valid and recorded in the check marker, so a maintainer can still approve this as a one-off.', true)
                .addList([
                  `Plugin: \`${result.plugin}\``,
                  `Requested by: ${result.requester}`,
                  `Source: ${result.source}`,
                  `Original size: ${result.width} × ${result.height} px`,
                  `Image SHA-256: \`${result.sourceSha256}\` (an approval must match this)`,
                  `Replaces an existing icon: ${result.replaces ? `yes (\`${result.replaces}\`)` : 'no'}`,
                ]);
            } else {
              summary.addRaw(`❌ **Needs changes:** ${result.error}`, true);
            }
            await summary
              .addList([
                `${existing ? 'Updated' : 'Posted'} the check comment`,
                `Labels added: ${add.join(', ')}`,
                `Labels removed: ${remove.filter(has).join(', ') || 'none'}`,
              ])
              .write();
