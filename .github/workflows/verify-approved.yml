name: Plugin Verified

# A maintainer verifies a plugin by adding the `verified` label to its verification
# request (an issue labelled `request-verification`), after reviewing it. This adds
# the plugin to verified-plugins.json, adds the icon from the form if it has one,
# regenerates assets/, commits `verify: <plugin>` to `latest`, posts the
# congratulations comment and closes the request.
#
# Verifying only goes ahead when the latest Plugin Checks comment passed, was run
# against the version that is `latest` on npm, and the request has not been edited
# since. Otherwise `verified` is removed and the reason posted. A plugin already in
# verified-plugins.json (added by hand before the label) skips those gates and is
# just congratulated and closed.
#
# The icon is optional: if it cannot be added, the plugin is still verified and the
# comment says why. As in Icon Approved, the image is only downloaded and decoded in
# the read-only `prepare-icon` job.
#
# Not covered: the wiki Verified-Plugins table, the extra wiki pages for Matter and
# Bluetooth plugins, plugin-authors.json for `@homebridge-plugins/` plugins (the
# request is refused until it has an entry) and unverifying.
on:
  issues:
    types:
      - labeled

permissions: {}

jobs:
  authorize:
    if: github.event.label.name == 'verified' && contains(github.event.issue.labels.*.name, 'request-verification')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      plugin: ${{ steps.check.outputs.plugin }}
      already_verified: ${{ steps.check.outputs.already_verified }}
      has_icon: ${{ steps.check.outputs.has_icon }}
      author_is_maintainer: ${{ steps.check.outputs.author_is_maintainer }}
      refusal: ${{ steps.check.outputs.refusal }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: latest
          persist-credentials: false

      - name: Check the approver, and that the request passed its checks
        id: check
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { checkApproval, isCheckComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/apply-verification.js`);
            const fs = require('node:fs');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const issue = { ...repo, issue_number: context.issue.number };
            const permissionOf = async (username) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username });
                return data.permission;
              } catch {
                return 'none';
              }
            };
            const canWrite = permission => ['admin', 'maintain', 'write'].includes(permission);

            const approver = context.payload.sender.login;
            const author = context.payload.issue.user.login;
            const summary = core.summary.addHeading('Authorize', 3).addList([
              `Issue: #${context.issue.number} by @${author}`,
              `Verified by: @${approver}`,
            ]);

            const approverPermission = await permissionOf(approver);
            if (!canWrite(approverPermission)) {
              await github.rest.issues.removeLabel({ ...issue, name: 'verified' });
              await summary.addRaw(`❌ **Rejected:** @${approver} has ${approverPermission} permission; \`verified\` needs write. The label was removed.`, true).write();
              core.setFailed(`${approver} has ${approverPermission} permission; verified needs write.`);
              return;
            }
            // Passed on to the icon check: maintainers may add icons for any plugin
            core.setOutput('author_is_maintainer', String(canWrite(await permissionOf(author))));

            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const { repository } = await github.graphql(
              'query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { issue(number: $number) { lastEditedAt } } }',
              { owner: repo.owner, repo: repo.repo, number: context.issue.number },
            );
            const result = await checkApproval({
              body: context.payload.issue.body,
              labels: context.payload.issue.labels.map(label => label.name),
              checkComment: comments.findLast(isCheckComment) || null,
              lastEditedAt: repository.issue.lastEditedAt,
              verified: JSON.parse(fs.readFileSync('verified-plugins.json', 'utf8')),
              authors: JSON.parse(fs.readFileSync('plugin-authors.json', 'utf8')),
              getLatestVersion: async (plugin) => {
                const res = await fetch(`https://registry.npmjs.org/${encodeURIComponent(plugin)}/latest`, { signal: AbortSignal.timeout(30000) });
                if (!res.ok) {
                  throw new Error(`npm returned HTTP ${res.status}`);
                }
                return (await res.json()).version;
              },
            });

            core.setOutput('ready', String(result.ready));
            core.setOutput('plugin', result.plugin || '');
            if (!result.ready) {
              core.setOutput('refusal', result.refusal);
              await summary.addRaw(`⛔ **Not verified:** ${result.refusal}`, true).write();
              return;
            }
            core.setOutput('already_verified', String(result.alreadyVerified));
            core.setOutput('has_icon', String(result.hasIcon));
            await summary
              .addRaw(result.alreadyVerified
                ? `✅ **Already verified:** \`${result.plugin}\` is in \`verified-plugins.json\`; nothing to commit.`
                : `✅ **Ready:** the checks of \`${result.plugin}\` v${result.version} passed, it is the latest version on npm, and the request has not been edited since.`, true)
              .addList([
                `Approver permission: ${approverPermission}`,
                `Icon in the request: ${result.hasIcon ? 'yes' : 'no'}`,
              ])
              .write();

  prepare-icon:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true' && needs.authorize.outputs.already_verified != 'true' && needs.authorize.outputs.has_icon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.prepare.outputs.ok }}
      result: ${{ steps.prepare.outputs.result }}
      png: ${{ steps.prepare.outputs.png }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: latest
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: v24

      - name: Install sharp
        run: npm install --no-save sharp@0.35.4

      - name: Check and convert the icon
        id: prepare
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_IS_MAINTAINER: ${{ needs.authorize.outputs.author_is_maintainer }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICON_FILE: ${{ runner.temp }}/icon.png
          RESULT_FILE: ${{ runner.temp }}/icon-result.json
        run: |
          node scripts/apply-icon-request.js prepare
          echo "ok=$(jq -r .ok "$RESULT_FILE")" >> "$GITHUB_OUTPUT"
          echo "result=$(jq -c . "$RESULT_FILE")" >> "$GITHUB_OUTPUT"
          if [[ "$(jq -r .ok "$RESULT_FILE")" == "true" ]]; then
            echo "png=$(base64 -w0 "$ICON_FILE")" >> "$GITHUB_OUTPUT"
          fi
          jq -r '"### Prepare icon\n" + if .ok then
            "✅ **Icon prepared** (read-only job, image decoded here only)\n\n"
            + "- Source: \(.source)\n- Original size: \(.width) × \(.height) px\n- Image SHA-256: `\(.sourceSha256)`"
          else "⚠️ **Icon skipped:** \(.error) The plugin is still verified." end' "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs:
      - authorize
      - prepare-icon
    # prepare-icon is skipped when there is no icon, and a failed icon never blocks verifying
    if: always() && needs.authorize.outputs.ready == 'true' && needs.authorize.outputs.already_verified != 'true'
    # One commit to the JSON files at a time, shared with Icon Approved. `queue: max`
    # keeps every waiting run (up to 100), so verifying a batch of plugins queues them
    # rather than GitHub cancelling all but the newest pending one.
    concurrency:
      group: plugin-json-files
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      result: ${{ steps.apply.outputs.result }}
      icon: ${{ steps.apply.outputs.icon }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: latest

      - uses: actions/setup-node@v7
        with:
          node-version: v24

      - name: Verify the plugin and commit
        id: apply
        env:
          PLUGIN: ${{ needs.authorize.outputs.plugin }}
          ICON_OK: ${{ needs.prepare-icon.outputs.ok }}
          PREPARED: ${{ needs.prepare-icon.outputs.result }}
          ICON_PNG: ${{ needs.prepare-icon.outputs.png }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ICON_FILE: ${{ runner.temp }}/icon.png
          RESULT_FILE: ${{ runner.temp }}/verify-result.json
          ICON_RESULT_FILE: ${{ runner.temp }}/icon-result.json
        run: |
          if [[ "$ICON_OK" == "true" ]]; then
            printf '%s' "$ICON_PNG" | base64 -d > "$ICON_FILE"
          fi
          echo '{}' > "$ICON_RESULT_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Rebuilding from a fresh `latest` on each attempt means a push that loses a
          # race to another commit (say, one pushed by hand) is simply redone on top of it.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin latest
            git reset --quiet --hard origin/latest
            git clean --quiet -fd icons

            node scripts/apply-verification.js add
            # Not ok, or verified by someone else since the authorize job: nothing to add
            if [[ "$(jq -r '.ok and (.unchanged | not)' "$RESULT_FILE")" != "true" ]]; then
              break
            fi

            # The icon is optional; a problem with it is reported, not fatal
            echo '{}' > "$ICON_RESULT_FILE"
            if [[ "$ICON_OK" == "true" ]]; then
              RESULT_FILE="$ICON_RESULT_FILE" node scripts/apply-icon-request.js commit
            fi

            # Sorts the JSON files and regenerates assets/plugins*.json
            node scripts/sort-json-files.js

            git add -- verified-plugins.json plugin-icons.json icons assets
            git commit --quiet -m "verify: $PLUGIN" -m "$ISSUE_URL"
            if git push --quiet origin HEAD:latest; then
              jq --arg sha "$(git rev-parse HEAD)" '. + {sha: $sha}' "$RESULT_FILE" > "$RESULT_FILE.tmp" && mv "$RESULT_FILE.tmp" "$RESULT_FILE"
              break
            fi
            echo "Push failed (attempt $attempt), retrying on the new latest"
            if [[ $attempt == 5 ]]; then
              echo '{"ok": false, "error": "The plugin could not be pushed to `latest` after 5 attempts; see the workflow log."}' > "$RESULT_FILE"
            fi
            sleep $((attempt * 5 + RANDOM % 5))
          done
          echo "result=$(jq -c . "$RESULT_FILE")" >> "$GITHUB_OUTPUT"
          echo "icon=$(jq -c . "$ICON_RESULT_FILE" 2>/dev/null || echo '{}')" >> "$GITHUB_OUTPUT"
          jq -r --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --slurpfile icon "$ICON_RESULT_FILE" '"### Apply\n" + if (.ok | not) then "❌ **Not committed:** \(.error)"
            elif .unchanged then "➖ **Nothing to commit:** `\(.plugin)` is already verified."
            else "✅ **Committed** [`\(.sha[0:7])`](\($repo)/commit/\(.sha)) to `latest`\n\n"
              + "- Added `\(.plugin)` to `verified-plugins.json`\n"
              + (if $icon[0].ok == true then "- \(if $icon[0].updated then "Replaced" else "Added" end): `\($icon[0].iconPath)` and `plugin-icons.json`\n"
                 elif $icon[0].ok == false then "- ⚠️ Icon not added: \($icon[0].error)\n" else "" end)
              + "- Also updated: `assets/plugins*.json`" end' "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs:
      - authorize
      - prepare-icon
      - apply
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: latest
          persist-credentials: false
          sparse-checkout: .github

      - name: Report on the issue
        uses: actions/github-script@v9
        env:
          REFUSAL: ${{ needs.authorize.outputs.refusal }}
          PLUGIN: ${{ needs.authorize.outputs.plugin }}
          ALREADY_VERIFIED: ${{ needs.authorize.outputs.already_verified }}
          HAS_ICON: ${{ needs.authorize.outputs.has_icon }}
          PREPARE_ICON_RESULT: ${{ needs.prepare-icon.outputs.result }}
          APPLY_RESULT: ${{ needs.apply.outputs.result }}
          APPLY_ICON: ${{ needs.apply.outputs.icon }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const parse = (text) => {
              try {
                return JSON.parse(text);
              } catch {
                return null;
              }
            };

            let result;
            if (process.env.REFUSAL) {
              result = { ok: false, error: process.env.REFUSAL };
            } else if (process.env.ALREADY_VERIFIED === 'true') {
              result = { ok: true, plugin: process.env.PLUGIN, unchanged: true };
            } else {
              result = parse(process.env.APPLY_RESULT) || { ok: false, error: 'The workflow failed before the plugin was added; see the workflow log.' };
              if (result.ok && !result.sha && !result.unchanged) {
                result = { ok: false, error: 'The plugin was not committed; see the workflow log.' };
              }
            }

            // Why an icon from the form was not added, if it was not
            let iconProblem = null;
            const applyIcon = parse(process.env.APPLY_ICON) || {};
            if (result.ok && !result.unchanged && process.env.HAS_ICON === 'true' && applyIcon.ok !== true) {
              iconProblem = applyIcon.error || parse(process.env.PREPARE_ICON_RESULT)?.error || 'The icon could not be prepared; see the workflow log.';
            }

            if (!result.ok) {
              await github.rest.issues.createComment({
                ...issue,
                body: `The plugin could not be verified automatically:\n\n> ${result.error}\n\n`
                  + 'The `verified` label has been removed. Once this is fixed, a maintainer can add it again.\n\n'
                  + `[Workflow run](${run})`,
              });
              // `verified` mirrors verified-plugins.json, so it must not stay on a plugin that is not in it
              try {
                await github.rest.issues.removeLabel({ ...issue, name: 'verified' });
              } catch {}
            } else {
              let iconNote = '';
              if (applyIcon.ok === true) {
                iconNote = 'Your icon has also been added, and should show in the Homebridge UI within the hour.\n\n'
                  + `<img src="${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/raw/${result.sha}/${applyIcon.iconPath}" width="100" height="100" alt="${result.plugin} icon">`;
              } else if (iconProblem) {
                iconNote = `The icon in your request could not be added automatically:\n\n> ${iconProblem}\n\n`
                  + 'You can send a new one with an [icon request](https://github.com/homebridge/plugins/issues/new?template=2_icon-request.yml).';
              }
              // The icon note goes straight after the opening line, before the badges
              const [opening, ...rest] = fs.readFileSync('.github/verified-comment.md', 'utf8').trim().split('\n\n');
              const body = [opening, iconNote, ...rest].filter(Boolean).join('\n\n');
              await github.rest.issues.createComment({ ...issue, body });
              try {
                await github.rest.issues.removeLabel({ ...issue, name: 'awaiting-final-review' });
              } catch {}
              await github.rest.issues.update({ ...issue, state: 'closed', state_reason: 'completed' });
            }

            await core.summary
              .addHeading('Report', 3)
              .addRaw(result.ok
                ? (result.unchanged ? `✅ **\`${result.plugin}\` was already verified.**` : `✅ **Verified** \`${result.plugin}\`.`)
                : `❌ **Not verified:** ${result.error}`, true)
              .addList([
                `Commented on #${context.issue.number}`,
                result.ok ? 'Removed `awaiting-final-review` and closed the request' : 'Removed the `verified` label and left the request open',
                ...(iconProblem ? [`Icon not added: ${iconProblem}`] : []),
              ])
              .write();
