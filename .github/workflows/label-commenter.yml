name: Label Commenter
on:
  issues:
    types:
      - labeled
permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Label Commenter
        if: ${{ contains(github.event.issue.labels.*.name, 'request-verification') }}
        uses: peaceiris/actions-label-commenter@f0dbbef043eb1b150b566db36b0bdc8b7f505579 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/label-commenter-config.yml
      - name: Remove awaiting-final-review label when verified
        if: github.event.label.name == 'verified'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'awaiting-final-review'
              });
              console.log('Removed awaiting-final-review label');
            } catch (error) {
              console.log('Label awaiting-final-review not found or already removed');
            }
